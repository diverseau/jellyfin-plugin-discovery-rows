<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Discovery preferences</title></head><body><div id="DiscoveryRowsPreferences" data-role="page" class="page type-interior"><div data-role="content"><div class="content-primary"><h1>Discovery preferences</h1><p>Hide titles from your Discovery Rows recommendations, or restore them here.</p><div id="drPreferenceMessage" role="status"></div><label>Find a title <input id="drPreferenceSearch" is="emby-input" type="search"></label><button id="drPreferenceFind" is="emby-button" class="raised">Find titles</button><div id="drPreferenceLibrary"></div><h2>Hidden titles</h2><div id="drHiddenTitles"></div><button is="emby-button" class="raised" id="drPreferenceRefresh">Refresh</button></div></div><script>
(function(){'use strict';const p=document.querySelector('#DiscoveryRowsPreferences');async function load(){try{const r=await ApiClient.fetch({url:ApiClient.getUrl('DiscoveryRows/Preferences'),type:'GET'});if(!r.ok)throw Error('Unable to load preferences.');const data=await r.json(),el=p.querySelector('#drHiddenTitles');el.replaceChildren();const hidden=data.filter(f=>f.Hidden??f.hidden);if(!hidden.length)el.textContent='You have no hidden titles.';for(const f of hidden){const key=f.WorkKey??f.workKey,row=document.createElement('p');row.textContent=(f.Name??f.name??key)+' ';const b=document.createElement('button');b.className='raised emby-button';b.textContent='Restore';b.addEventListener('click',async()=>{try{const response=await ApiClient.fetch({url:ApiClient.getUrl('DiscoveryRows/Preferences/Restore'),type:'POST',headers:{'Content-Type':'application/json'},data:JSON.stringify({workKey:key})});if(!response.ok)throw Error('Unable to restore title.');await load();}catch(e){p.querySelector('#drPreferenceMessage').textContent=e.message;}});row.append(b);el.append(row);}}catch(e){p.querySelector('#drPreferenceMessage').textContent=e.message;}}p.addEventListener('pageshow',load);p.querySelector('#drPreferenceRefresh').addEventListener('click',load);load();})();
const drPrefs=document.querySelector('#DiscoveryRowsPreferences');drPrefs.querySelector('#drPreferenceFind').addEventListener('click',async()=>{try{const response=await ApiClient.fetch({url:ApiClient.getUrl('DiscoveryRows/Preferences/Library',{search:drPrefs.querySelector('#drPreferenceSearch').value}),type:'GET'});if(!response.ok)throw Error('Unable to find your titles.');const data=await response.json(),el=drPrefs.querySelector('#drPreferenceLibrary');el.replaceChildren();for(const item of data){const row=document.createElement('p');row.textContent=(item.Name??item.name)+' ';const hidden=item.Hidden??item.hidden,b=document.createElement('button');b.className='raised emby-button';b.textContent=hidden?'Restore':'Hide from recommendations';b.addEventListener('click',async()=>{try{const r=await ApiClient.fetch({url:ApiClient.getUrl('DiscoveryRows/Preferences'),type:'POST',headers:{'Content-Type':'application/json'},data:JSON.stringify({itemId:item.Id??item.id,hidden:!hidden})});if(!r.ok)throw Error('Unable to change this preference.');drPrefs.querySelector('#drPreferenceMessage').textContent='Preference saved.';drPrefs.querySelector('#drPreferenceFind').click();drPrefs.querySelector('#drPreferenceRefresh').click();}catch(e){drPrefs.querySelector('#drPreferenceMessage').textContent=e.message;}});row.append(b);el.append(row);}}catch(e){drPrefs.querySelector('#drPreferenceMessage').textContent=e.message;}});
</script></div></body></html>
